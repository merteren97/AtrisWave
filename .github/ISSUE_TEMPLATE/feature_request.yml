name: Feature Request
description: Suggest a DSP module, routing capability, plugin feature, or UI improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make **AtrisWave** better? Share it below!

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Microphone DSP / Effects
        - Virtual Channels & App Routing
        - Mixer UI / UX / Metering
        - CLAP / VST3 Plugin Hosting
        - Kernel Virtual Audio Driver
        - Localization / Accessibility
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What workflow or limitation does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you envision this working in AtrisWave.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or references from other tools (e.g., OBS, Sonar, Wave Link, VoiceMeeter).
