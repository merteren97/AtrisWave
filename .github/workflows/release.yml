name: AtrisWave Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version (e.g. v0.1.3)'
        required: true
        default: 'v0.1.3'

permissions:
  contents: write

jobs:
  release-windows-x64:
    name: Build, Test & Publish Windows x64 Release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release Tag: $tag | Version: $ver | Prerelease: false"

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build & Test C++20 Audio Engine and Watchdog
        working-directory: engine
        run: |
          cmake --preset msvc-release
          cmake --build --preset msvc-release
          ctest --preset msvc-release --output-on-failure
          .\build\msvc-release\AtrisWaveEngine.exe --version
          .\build\msvc-release\AtrisWaveEngine.exe --self-test
          .\build\msvc-release\AtrisWaveWatchdog.exe --version

      - name: Build & Test C++20 Out-of-Process Plugin Host
        working-directory: plugin-host
        run: |
          cmake --preset msvc-release
          cmake --build --preset msvc-release
          ctest --preset msvc-release --output-on-failure

      - name: Build & Test .NET 10 WPF UI (including Live E2E Engine Tests)
        run: |
          dotnet restore ui/AtrisWave.sln
          dotnet build ui/AtrisWave.sln --configuration Release --no-restore
          dotnet test ui/AtrisWave.sln --configuration Release --no-build --verbosity normal

      - name: Stage Self-Contained Windows x64 Portable Bundle
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $staging = "dist\AtrisWave-win-x64"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          dotnet publish ui/AtrisWave.UI/AtrisWave.UI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=$ver `
            --output $staging

          Copy-Item "engine\build\msvc-release\AtrisWaveEngine.exe" $staging -Force
          Copy-Item "engine\build\msvc-release\AtrisWaveWatchdog.exe" $staging -Force
          Copy-Item "plugin-host\build\msvc-release\AtrisWavePluginHost.exe" $staging -Force
          Copy-Item "LICENSE" $staging -Force
          Copy-Item "README.md" $staging -Force
          Copy-Item "README-TR.md" $staging -Force

          $zipPath = "dist\AtrisWave-$ver-win-x64-portable.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zipPath -Force
          Write-Host "Created portable archive: $zipPath"

      - name: Build Inno Setup 6 Installer
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $defaultPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $defaultPath)) {
              choco install innosetup -y --no-progress
            }
            $isccPath = $defaultPath
          } else {
            $isccPath = $iscc.Source
          }
          & $isccPath "/DMyAppVersion=$ver" "installer\AtrisWave.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Generate SHA256 Checksums
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $files = @(
            "dist\AtrisWave-$ver-win-x64-portable.zip",
            "dist\AtrisWave-Setup-$ver-win-x64.exe"
          )
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AtrisWave-${{ steps.meta.outputs.version }}-win-x64
          path: |
            dist/AtrisWave-${{ steps.meta.outputs.version }}-win-x64-portable.zip
            dist/AtrisWave-Setup-${{ steps.meta.outputs.version }}-win-x64.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: AtrisWave ${{ steps.meta.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: |
            dist/AtrisWave-${{ steps.meta.outputs.version }}-win-x64-portable.zip
            dist/AtrisWave-Setup-${{ steps.meta.outputs.version }}-win-x64.exe
            dist/SHA256SUMS.txt
